<!doctype html>
<meta charset="utf-8" />
<title>Code runner</title>
<!--
  Runs learner code for the playground. The page embeds this file in an iframe
  with sandbox="allow-scripts" (no allow-same-origin), so it gets an opaque
  origin: code here can't read the app's cookies, storage or DOM.
  Code runs in a module Web Worker, so an infinite loop can't freeze the page, and the
  worker is terminated when a run passes its time limit.
-->
<script type="text/plain" id="worker-source">
  "use strict";

  var PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/";
  var MAX_LOG_LINES = 1000;

  var runId = 0;
  var logCount = 0;
  var pyodidePromise = null;
  var pyodideReady = false;

  function send(type, data) {
    data = data || {};
    data.type = type;
    data.runId = runId;
    postMessage(data);
  }

  function emit(level, text, extra) {
    logCount += 1;
    if (logCount > MAX_LOG_LINES) {
      if (logCount === MAX_LOG_LINES + 1) {
        send("log", { level: "system", text: "Output limit reached. Later output is hidden." });
      }
      return;
    }
    var data = extra || {};
    data.level = level;
    data.text = text;
    send("log", data);
  }

  function fmt(value, depth) {
    depth = depth || 0;
    var t = typeof value;
    if (t === "string") return depth ? JSON.stringify(value) : value;
    if (t === "bigint") return String(value) + "n";
    if (value === null || t === "undefined" || t === "number" || t === "boolean" || t === "symbol") return String(value);
    if (t === "function") return "[Function" + (value.name ? ": " + value.name : "") + "]";
    if (value instanceof Error) return value.name + ": " + value.message;
    if (depth > 2) return Array.isArray(value) ? "[Array]" : "[Object]";
    try {
      if (Array.isArray(value)) {
        return "[" + value.slice(0, 100).map(function (v) { return fmt(v, depth + 1); }).join(", ") + (value.length > 100 ? ", …" : "") + "]";
      }
      if (value instanceof Map) {
        return "Map(" + value.size + ") {" + Array.from(value).slice(0, 50).map(function (e) { return fmt(e[0], depth + 1) + " => " + fmt(e[1], depth + 1); }).join(", ") + "}";
      }
      if (value instanceof Set) {
        return "Set(" + value.size + ") {" + Array.from(value).slice(0, 50).map(function (v) { return fmt(v, depth + 1); }).join(", ") + "}";
      }
      var keys = Object.keys(value);
      var ctor = value.constructor && value.constructor.name;
      var prefix = ctor && ctor !== "Object" ? ctor + " " : "";
      if (!keys.length) return prefix + "{}";
      return prefix + "{ " + keys.slice(0, 50).map(function (k) { return k + ": " + fmt(value[k], depth + 1); }).join(", ") + (keys.length > 50 ? ", …" : "") + " }";
    } catch (e) {
      return String(value);
    }
  }

  ["log", "info", "warn", "error", "debug"].forEach(function (level) {
    console[level] = function () {
      emit(level === "debug" ? "log" : level, Array.prototype.map.call(arguments, function (a) { return fmt(a); }).join(" "));
    };
  });

  // Errors thrown later, from timers or promises.
  self.addEventListener("error", function (event) {
    event.preventDefault();
    var err = event.error;
    reportJs(err || { name: "Error", message: event.message });
  });
  self.addEventListener("unhandledrejection", function (event) {
    event.preventDefault();
    reportJs(event.reason);
  });

  function reportJs(err) {
    var text = err && err.name ? err.name + ": " + err.message : "Uncaught " + fmt(err);
    // User code is wrapped in one extra line, see runJs.
    var match = err && err.stack && /main\.js:(\d+):\d+/.exec(err.stack);
    emit("error", text, { file: "main.js", line: match ? Number(match[1]) - 1 : undefined });
  }

  function reportPython(err) {
    var message = String((err && err.message) || err).trim();
    var lines = message.split("\n");
    var start = lines.findIndex(function (l) { return l.indexOf('File "main.py"') !== -1; });
    var text = start > 0 ? ["Traceback (most recent call last):"].concat(lines.slice(start)).join("\n") : message;
    var re = /File "main\.py", line (\d+)/g;
    var match;
    var line;
    while ((match = re.exec(text))) line = Number(match[1]);
    emit("error", text, { file: "main.py", line: line });
    if (/EOFError/.test(text)) {
      emit("system", "input() can't read from the keyboard here yet. Put test values in variables instead.");
    }
  }

  function loadPython() {
    if (!pyodidePromise) {
      pyodidePromise = (async function () {
        var pyodideModule = await import(PYODIDE_URL + "pyodide.mjs");
        var py = await pyodideModule.loadPyodide({ indexURL: PYODIDE_URL });
        py.setStdout({ batched: function (text) { emit("log", text); } });
        py.setStderr({ batched: function (text) { emit("error", text); } });
        py.setStdin({ stdin: function () { return null; } });
        pyodideReady = true;
        return py;
      })();
      pyodidePromise.catch(function () { pyodidePromise = null; });
    }
    return pyodidePromise;
  }

  async function runJs(code) {
    send("started");
    var t0 = performance.now();
    try {
      // A fresh function scope per run, so `let` and `const` can be redeclared,
      // and top-level await works.
      await (0, eval)("(async () => {\n" + code + "\n})()\n//# sourceURL=main.js");
      send("done", { ms: performance.now() - t0 });
    } catch (err) {
      reportJs(err);
      send("done", { ms: performance.now() - t0, failed: true });
    }
  }

  async function runPython(code) {
    var py;
    try {
      if (!pyodideReady) send("status", { text: "Loading Python. The first run takes a few seconds." });
      py = await loadPython();
    } catch (err) {
      emit("error", "Python couldn't load. Check your internet connection and try again.");
      emit("system", "Details: " + String((err && err.message) || err));
      send("done", { ms: 0, failed: true });
      return;
    }
    send("started");
    var t0 = performance.now();
    var scope = py.toPy({ __name__: "__main__" });
    try {
      await py.runPythonAsync(code, { globals: scope, filename: "main.py", dedent: false });
      send("done", { ms: performance.now() - t0 });
    } catch (err) {
      reportPython(err);
      send("done", { ms: performance.now() - t0, failed: true });
    } finally {
      scope.destroy();
    }
  }

  self.onmessage = function (event) {
    var msg = event.data || {};
    if (msg.type === "warm" && msg.lang === "python") {
      loadPython().catch(function () {});
      return;
    }
    if (msg.type !== "run") return;
    runId = msg.runId;
    logCount = 0;
    if (msg.lang === "python") runPython(msg.code);
    else runJs(msg.code);
  };
</script>
<script>
  "use strict";
  var TIME_LIMIT_SECONDS = { javascript: 5, python: 10 };
  // A data: URL module worker. Pyodide needs a module worker, and in an
  // opaque-origin frame Chrome refuses module workers from blob: URLs.
  var workerUrl =
    "data:text/javascript;charset=utf-8," +
    encodeURIComponent(document.getElementById("worker-source").textContent);
  var workers = {};
  var timers = {};

  function post(msg) {
    msg.source = "pg-runner";
    parent.postMessage(msg, "*");
  }

  function kill(lang) {
    if (workers[lang]) workers[lang].terminate();
    delete workers[lang];
    clearTimeout(timers[lang]);
  }

  function spawn(lang) {
    var worker = new Worker(workerUrl, { type: "module" });
    worker.onmessage = function (event) {
      var msg = event.data;
      msg.lang = lang;
      if (msg.type === "started") {
        clearTimeout(timers[lang]);
        timers[lang] = setTimeout(function () {
          kill(lang);
          post({ type: "timeout", lang: lang, runId: msg.runId, seconds: TIME_LIMIT_SECONDS[lang] });
        }, TIME_LIMIT_SECONDS[lang] * 1000);
      }
      if (msg.type === "done") clearTimeout(timers[lang]);
      post(msg);
    };
    workers[lang] = worker;
    return worker;
  }

  window.addEventListener("message", function (event) {
    if (event.source !== parent) return;
    var msg = event.data || {};
    if (msg.lang !== "javascript" && msg.lang !== "python") return;
    if (msg.type === "run") {
      // A fresh JavaScript worker per run stops timers from the last run.
      if (msg.lang === "javascript") kill("javascript");
      (workers[msg.lang] || spawn(msg.lang)).postMessage(msg);
    } else if (msg.type === "warm") {
      (workers[msg.lang] || spawn(msg.lang)).postMessage(msg);
    } else if (msg.type === "stop") {
      kill(msg.lang);
      post({ type: "stopped", lang: msg.lang, runId: msg.runId });
    }
  });

  post({ type: "ready" });
</script>
